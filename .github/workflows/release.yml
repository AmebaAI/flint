name: Release Flint

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to recover or republish
        required: true
        type: string
      commit:
        description: Merged commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flint-release
  cancel-in-progress: false

jobs:
  validate-release-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          cache: false

      - name: Validate release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$PR_BASE" = "main"
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "flint") | .version')
          IFS=. read -r major minor patch extra <<< "$version"
          test -z "${extra:-}"
          for component in "$major" "$minor" "$patch"; do
            [[ "$component" =~ ^(0|[1-9][0-9]*)$ ]]
          done
          test "$RELEASE_BRANCH" = "release/v$version"
          test "$PR_TITLE" = "Release Flint v$version"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          if awk '
            /^## \[Unreleased\]/ { unreleased=1; next }
            unreleased && /^## \[/ { exit }
            unreleased && /^- / { found=1 }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md; then
            echo 'Unreleased must contain no entries in a release PR' >&2
            exit 1
          fi
          latest=$(
            gh api "repos/$GITHUB_REPOSITORY/tags" \
              --paginate --jq '.[].name' |
              sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' |
              sort -V | tail -1
          )
          if [ -n "$latest" ]; then
            greatest=$(
              printf '%s\n%s\n' "$latest" "$version" |
                sort -V | tail -1
            )
            test "$greatest" = "$version"
            test "$latest" != "$version"
          fi

      - name: Run ordinary verification
        run: mise run check

      - name: Run Docker lifecycle verification
        run: mise run test:docker

      - name: Run containerized SDK verification
        run: mise run test:container

      - name: Verify local publication task
        run: mise run publishLocal

  prepare-release:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    outputs:
      image: ${{ steps.revision.outputs.image }}
      minor: ${{ steps.revision.outputs.minor }}
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - name: Select release revision
        id: revision
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_VERSION: ${{ github.event.pull_request.head.ref }}
          INPUT_SHA: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$EVENT_SHA"
          version="${EVENT_VERSION#release/v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flint"
          if [ -n "$INPUT_SHA" ]; then sha="$INPUT_SHA"; fi
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          IFS=. read -r major minor patch extra <<< "$version"
          test -z "${extra:-}"
          for component in "$major" "$minor" "$patch"; do
            [[ "$component" =~ ^(0|[1-9][0-9]*)$ ]]
          done
          {
            printf 'image=%s\n' "$image"
            printf 'sha=%s\n' "$sha"
            printf 'version=%s\n' "$version"
            printf 'minor=%s.%s\n' "$major" "$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          cache: false

      - name: Validate revision, version, and release order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "flint") | .version')
          test "$manifest_version" = "$VERSION"
          grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...main" --jq .status)
          case "$comparison" in
            ahead|identical) ;;
            *) echo 'Release commit is not reachable from main' >&2; exit 1 ;;
          esac
          latest=$(
            gh api "repos/$GITHUB_REPOSITORY/tags" \
              --paginate --jq '.[].name' |
              sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' |
              sort -V | tail -1
          )
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/v$VERSION\") | .object.sha")
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
            test "$latest" = "$VERSION"
          elif [ -n "$latest" ]; then
            greatest=$(
              printf '%s\n%s\n' "$latest" "$VERSION" |
                sort -V | tail -1
            )
            test "$greatest" = "$VERSION"
            test "$latest" != "$VERSION"
          fi

      - name: Run ordinary verification
        run: mise run check

      - name: Run Docker lifecycle verification
        run: mise run test:docker

      - name: Run containerized SDK verification
        run: mise run test:container

      - name: Verify local publication task
        run: mise run publishLocal

  create-release-tag:
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$RELEASE_SHA" >/dev/null
          fi

  build-release-image:
    name: Build release image (${{ matrix.arch }})
    needs: [prepare-release, create-release-tag]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SCOPE: flint-release-${{ matrix.arch }}
      IMAGE: ${{ needs.prepare-release.outputs.image }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Prepare image output
        id: output
        shell: bash
        run: |
          value="type=image,name=$IMAGE"
          value+=",push-by-digest=true"
          value+=",name-canonical=true,push=true"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Flint
            org.opencontainers.image.vendor=Ameba
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=${{ env.SOURCE }}
          outputs: ${{ steps.output.outputs.value }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ env.SCOPE }}

      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test "$DIGEST" != "${DIGEST#sha256:}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [prepare-release, build-release-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ needs.prepare-release.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=${{ needs.prepare-release.outputs.minor }}
            type=raw,value=latest

      - name: Publish multi-platform image
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-release.outputs.image }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=(/tmp/digests/*)
          test "${#digest_files[@]}" -eq 2
          sources=()
          for file in "${digest_files[@]}"; do
            sources+=("$IMAGE@sha256:${file##*/}")
          done
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tag_args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          test "${#tag_args[@]}" -gt 0
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" |
            jq -e '
              [.manifests[].platform |
                select(.os == "linux") |
                "\(.os)/\(.architecture)"] |
              sort == ["linux/amd64", "linux/arm64"]
            '

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            BEGIN { header = "## [" version "] - " }
            index($0, header) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/flint-release-notes.md
          test -s /tmp/flint-release-notes.md
          release="v$VERSION"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            gh release edit "$release" --repo "$GITHUB_REPOSITORY" \
              --title "Flint v$VERSION" \
              --notes-file /tmp/flint-release-notes.md
          else
            gh release create "$release" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Flint v$VERSION" \
              --notes-file /tmp/flint-release-notes.md
          fi
