name: Release Flint

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to recover or republish
        required: true
        type: string
      commit:
        description: Merged commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flint-release
  cancel-in-progress: false

jobs:
  validate-release-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          cache: false

      - name: Validate release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$PR_BASE" = "main"
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "flint") | .version')
          IFS=. read -r major minor patch extra <<< "$version"
          test -z "${extra:-}"
          for component in "$major" "$minor" "$patch"; do
            [[ "$component" =~ ^(0|[1-9][0-9]*)$ ]]
          done
          test "$RELEASE_BRANCH" = "release/v$version"
          test "$PR_TITLE" = "Release Flint v$version"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          if awk '
            /^## \[Unreleased\]/ { unreleased=1; next }
            unreleased && /^## \[/ { exit }
            unreleased && /^- / { found=1 }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md; then
            echo 'Unreleased must contain no entries in a release PR' >&2
            exit 1
          fi
          latest=$(
            gh api "repos/$GITHUB_REPOSITORY/tags" \
              --paginate --jq '.[].name' |
              sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' |
              sort -V | tail -1
          )
          if [ -n "$latest" ]; then
            greatest=$(
              printf '%s\n%s\n' "$latest" "$version" |
                sort -V | tail -1
            )
            test "$greatest" = "$version"
            test "$latest" != "$version"
          fi

      - name: Run ordinary verification
        run: mise run check

      - name: Run Docker lifecycle verification
        run: mise run test:docker

      - name: Run containerized SDK verification
        run: mise run test:container

      - name: Run CI image verification
        run: mise run ci

      - name: Verify local publication task
        run: mise run publishLocal

  publish-release:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Select release revision
        id: revision
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_VERSION: ${{ github.event.pull_request.head.ref }}
          INPUT_SHA: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$EVENT_SHA"
          version="${EVENT_VERSION#release/v}"
          if [ -n "$INPUT_SHA" ]; then sha="$INPUT_SHA"; fi
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          IFS=. read -r major minor patch extra <<< "$version"
          test -z "${extra:-}"
          for component in "$major" "$minor" "$patch"; do
            [[ "$component" =~ ^(0|[1-9][0-9]*)$ ]]
          done
          {
            printf 'sha=%s\n' "$sha"
            printf 'version=%s\n' "$version"
            printf 'minor=%s.%s\n' "$major" "$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          cache: false

      - name: Validate revision, version, and release order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "flint") | .version')
          test "$manifest_version" = "$VERSION"
          grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...main" --jq .status)
          case "$comparison" in
            ahead|identical) ;;
            *) echo 'Release commit is not reachable from main' >&2; exit 1 ;;
          esac
          latest=$(
            gh api "repos/$GITHUB_REPOSITORY/tags" \
              --paginate --jq '.[].name' |
              sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' |
              sort -V | tail -1
          )
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/v$VERSION\") | .object.sha")
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
            test "$latest" = "$VERSION"
          elif [ -n "$latest" ]; then
            greatest=$(
              printf '%s\n%s\n' "$latest" "$VERSION" |
                sort -V | tail -1
            )
            test "$greatest" = "$VERSION"
            test "$latest" != "$VERSION"
          fi

      - name: Run ordinary verification
        run: mise run check

      - name: Run Docker lifecycle verification
        run: mise run test:docker

      - name: Run containerized SDK verification
        run: mise run test:container

      - name: Run CI image verification
        run: mise run ci

      - name: Verify local publication task
        run: mise run publishLocal

      - name: Compute image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flint"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.revision.outputs.version }}
            type=raw,value=${{ steps.revision.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Flint
            org.opencontainers.image.vendor=Ameba
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version={{version}}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      - name: Build and publish container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=flint-release
          cache-to: type=gha,mode=max,scope=flint-release

      - name: Create or verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            BEGIN { header = "## [" version "] - " }
            index($0, header) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/flint-release-notes.md
          test -s /tmp/flint-release-notes.md
          release="v$VERSION"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            gh release edit "$release" --repo "$GITHUB_REPOSITORY" \
              --title "Flint v$VERSION" \
              --notes-file /tmp/flint-release-notes.md
          else
            gh release create "$release" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Flint v$VERSION" \
              --notes-file /tmp/flint-release-notes.md
          fi
