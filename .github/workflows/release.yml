name: Release Flint

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to recover or republish
        required: true
        type: string
      commit:
        description: Merged commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flint-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-pr:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.pull_request.merge_commit_sha ||
            github.event.pull_request.head.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: false

      - name: Validate release metadata
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f CHANGELOG.md
          version=$(sed -n \
            's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          test "$RELEASE_BRANCH" = "release/v$version"
          test "$PR_TITLE" = "Release Flint v$version"
          grep -q "^## \[$version\] - " CHANGELOG.md
          if grep -A8 -q '^## \[Unreleased\].*' CHANGELOG.md \
            && grep -A8 -E '^## \[Unreleased\]' CHANGELOG.md \
            | grep -q '^[-*]'; then
            echo 'Unreleased must be empty in a release PR' >&2
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Run release checks
        run: mise run check

  publish-release:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Select release revision
        id: revision
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          INPUT_SHA: ${{ inputs.commit }}
          EVENT_VERSION: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$EVENT_SHA"
          version="${EVENT_VERSION#release/v}"
          if [ -n "$INPUT_SHA" ]; then sha="$INPUT_SHA"; fi
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; fi
          case "$version" in
            ''|*[!0-9.]*|.*|*.) echo 'Invalid release version' >&2; exit 1 ;;
          esac
          printf 'sha=%s\nversion=%s\n' "$sha" "$version" >> "$GITHUB_OUTPUT"

      - name: Check out merged release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: false

      - name: Revalidate release contents
        shell: bash
        env:
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version=$(sed -n \
            's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          test "$manifest_version" = "$VERSION"
          grep -q "^## \[$VERSION\] - " CHANGELOG.md
          cargo metadata --no-deps --format-version 1 >/dev/null
          mise run check

      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flint" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        env:
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          {
            echo 'value<<TAGS'
            echo "type=raw,value=$VERSION"
            echo "type=semver,pattern={{major}}.{{minor}},value=v$VERSION"
            echo "type=semver,pattern={{major}},value=v$VERSION"
            echo 'type=raw,value=latest'
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=Flint
            org.opencontainers.image.vendor=Ameba
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=flint-release
          cache-to: type=gha,mode=max,scope=flint-release

      - name: Create or verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.revision.outputs.version }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          ref_api="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          existing=$(gh api "$ref_api" --jq .object.sha 2>/dev/null || true)
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
          else
            refs_api="repos/$GITHUB_REPOSITORY/git/refs"
            gh api "$refs_api" -f ref="refs/tags/$tag" \
              -f sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            BEGIN { header = "## [" version "] - " }
            index($0, header) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/flint-release-notes.md
          test -s /tmp/flint-release-notes.md
          release="v$VERSION"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            gh release edit "$release" --repo "$GITHUB_REPOSITORY" \
              --title "Flint v$VERSION" \
              --notes-file /tmp/flint-release-notes.md
          else
            gh release create "$release" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Flint v$VERSION" \
              --notes-file /tmp/flint-release-notes.md
          fi
