[tools]
rust = { version = "1.96.0", components = "rustfmt,clippy" }

[tasks.fmt]
description = "Format Rust source"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Run the pre-release verification gate"
depends = ["fmt:check", "lint", "build", "test"]

[tasks.lint]
description = "Run Clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --workspace"

[tasks.build]
description = "Build the Flint workspace"
run = "cargo build --workspace"

[tasks."build:release"]
description = "Build the release binary"
run = "cargo build --release --bin flint"

[tasks.run]
description = "Run Flint locally"
run = "cargo run --bin flint"

[tasks."docker:build"]
description = "Build the local Flint container"
run = "docker build --tag flint:local ."

[tasks.publishLocal]
description = "Build and publish Flint to the local Docker daemon as flint:local"
depends = ["docker:build"]

[tasks."fixture:build"]
description = "Build the deterministic runtime fixture image"
run = "docker build --tag flint-runtime-fixture:local tests/fixtures/runtime"

[tasks."test:docker"]
description = "Run ignored lifecycle tests against local Docker"
depends = ["fixture:build"]
run = "env -u FLINT_FIXTURE_UNSET OPENAI_API_KEY=test FLINT_FIXTURE_ALLOWED=fixture-allowed FLINT_FIXTURE_UNAPPROVED=must-not-forward cargo test --lib -- --ignored --nocapture"

[tasks."test:container"]
description = "Run SDK coverage against containerized Flint"
depends = ["fixture:build", "docker:build"]
run = "export AGENTCORE_RUNTIME_OWNER=flint-container-test FLINT_PORT=35470 AGENTCORE_RUNTIME_ENDPOINT_URL=http://127.0.0.1:35470; trap 'docker compose -f compose.example.yml down --remove-orphans >/dev/null 2>&1 || true' EXIT INT TERM; docker compose -f compose.example.yml down --remove-orphans >/dev/null 2>&1 || true; if output=$(docker compose -f compose.example.yml run --rm --no-deps -e FLINT_DOCKER_NETWORK=flint-agentcore-mismatch flint 2>&1); then echo 'mismatched Compose network unexpectedly passed startup preflight' >&2; exit 1; fi; printf '%s\n' \"$output\" | grep -E 'Docker network flint-agentcore-mismatch (is unavailable|.*is not attached)' >/dev/null; docker compose -f compose.example.yml up -d --wait flint && cargo test --test containerized -- --ignored --nocapture"

[tasks.ci]
description = "Run checks and build the local container"
depends = ["check", "docker:build"]
