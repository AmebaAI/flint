[package]
name = "flint"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A local development-focused AWS AgentCore Runtime emulator"
repository = "https://github.com/AmebaAI/flint"
license = "GPL-3.0-only"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
aws-smithy-eventstream = "=0.61.2"
aws-smithy-types = "=1.6.2"
axum = { version = "0.8.9", features = ["multipart"] }
bollard = "0.20.2"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
  "stream",
] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
aws-sdk-bedrockagentcore = { version = "=1.60.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
